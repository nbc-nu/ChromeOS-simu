<div id="splash" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000000;display:flex;justify-content:center;align-items:center;z-index:9999;transition:opacity 1s ease;opacity:1;">
    <div style="font-family:sans-serif;font-size:24px;color:#fff;">ChromeOS</div>
</div>

<script>
    setTimeout(function() {
        var s = document.getElementById('splash');
        s.style.opacity = '0';
        setTimeout(function() { s.style.display = 'none'; }, 1000);
    }, 2000);
</script>

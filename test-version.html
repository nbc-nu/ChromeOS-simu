<!DOCTYPE html>
<html lang="pt-BR" style="margin:0;overflow:hidden;height:100%;font-family:sans-serif;">
<head>
    <meta charset="UTF-8"><title>ChromeOS Desktop</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #8ec5fc linear-gradient(135deg,#e0c3fc,#8ec5fc); height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none; }
        #d { flex: 1; position: relative; width: 100%; }
        
        /* Janelas Padrão ChromeOS */
        .w { position: absolute; top: 40px; left: 40px; right: 40px; bottom: 80px; background: #fff; border-radius: 8px; box-shadow: 0 12px 35px rgba(0,0,0,0.15); display: none; flex-direction: column; overflow: hidden; border: 1px solid #cfd8dc; z-index: 10; }
        .w.f { top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important; border-radius: 0 !important; border: none !important; }
        
        /* Controles de Janela Circulares do ChromeOS */
        .h { background: #f1f3f4; padding: 0 16px; height: 44px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e0e0e0; }
        .c { display: flex; gap: 8px; align-items: center; }
        .btn { background: none; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background-color 0.15s; }
        .btn:hover { background-color: rgba(0,0,0,0.08); }
        .btn svg { width: 12px; height: 12px; fill: #5f6368; }
        
        .content { width: 100%; height: calc(100% - 44px); overflow: auto; }
        iframe { width: 100%; height: 100%; border: none; }
        .bar { background: #fff; padding: 6px 12px; display: flex; gap: 10px; border-bottom: 1px solid #e0e0e0; }
        .in { flex: 1; padding: 6px 12px; border-radius: 20px; border: 1px solid #ccc; background: #f1f3f4; outline: none; }
        #m { position: absolute; bottom: 66px; left: 16px; width: 320px; background: rgba(255,255,255,0.95); backdrop-filter: blur(15px); border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.15); display: none; flex-direction: column; padding: 16px; z-index: 10000; border: 1px solid rgba(0,0,0,0.08); }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .it { display: flex; flex-direction: column; align-items: center; padding: 10px; cursor: pointer; font-size: 12px; color: #3c4043; border-radius: 8px; }
        .it:hover { background: rgba(0,0,0,0.05); }
        .it img, .icon img { width: 32px; height: 32px; object-fit: contain; margin-bottom: 6px; }
        .f-app { display: flex; height: 100%; }
        .f-side { width: 160px; background: #f8f9fa; border-right: 1px solid #dadce0; padding: 12px 0; font-size: 13px; color: #5f6368; }
        .f-main { flex: 1; padding: 20px; font-size: 13px; }
        .t-body { background: #1e1e1e; color: #00ff00; font-family: monospace; padding: 15px; height: 100%; overflow-y: auto; }
        .t-in { background: none; border: none; color: #fff; outline: none; font-family: inherit; width: 80%; }
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
        .form-group input { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
        .add-btn { background: #1a73e8; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 8px; }
        
        #shelf { height: 56px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; z-index: 9999; border-top: 1px solid rgba(255,255,255,0.4); }
        .s-icons { display: flex; gap: 16px; align-items: center; }
        .icon { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%; }
        .icon:hover { background: rgba(0,0,0,0.05); }
    </style>
</head>
<body onclick="document.getElementById('m').style.display='none'">
    <div id="d">
        <!-- Launcher -->
        <div id="m" onclick="event.stopPropagation()">
            <h3 style="margin:0 0 12px 0;font-size:14px;color:#5f6368;">Aplicativos</h3>
            <div class="grid" id="l-grid">
                <div class="it" onclick="win('w-c')"><img src="https://wikimedia.org"><span>Chrome</span></div>
                <div class="it" onclick="win('w-f')"><img src="https://wikimedia.org"><span>Arquivos</span></div>
                <div class="it" onclick="win('w-t')"><img src="https://wikimedia.org"><span>Terminal</span></div>
                <div class="it" onclick="win('w-s')"><img src="https://wikimedia.org"><span>PWA Builder</span></div>
            </div>
        </div>

        <!-- Google Chrome -->
        <div id="w-c" class="w">
            <div class="h"><span>Google Chrome</span>
                <div class="c">
                    <button class="btn" onclick="cls('w-c')"><svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg></button>
                    <button class="btn" onclick="fsk('w-c')"><svg viewBox="0 0 24 24"><path d="M18 4H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H6V6h12v12z"/></svg></button>
                    <button class="btn" onclick="cls('w-c')"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
                </div>
            </div>
            <div class="bar"><input type="text" class="in" id="url" value="https://google.com" onkeydown="nav(event)"></div>
            <div class="content"><iframe id="ifr" src="https://google.com"></iframe></div>
        </div>

        <!-- Arquivos -->
        <div id="w-f" class="w">
            <div class="h"><span>Arquivos</span>
                <div class="c">
                    <button class="btn" onclick="cls('w-f')"><svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg></button>
                    <button class="btn" onclick="fsk('w-f')"><svg viewBox="0 0 24 24"><path d="M18 4H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H6V6h12v12z"/></svg></button>
                    <button class="btn" onclick="cls('w-f')"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
                </div>
            </div>
            <div class="content"><div class="f-app"><div class="f-side"><div style="padding:8px 20px;background:#e8f0fe;color:#1a73e8;font-weight:500;">📁 Meus arquivos</div><div style="padding:6px 35px;">Downloads</div><div style="padding:6px 35px;">Arquivos Linux</div><div style="padding:8px 20px;">☁️ Google Drive</div></div><div class="f-main"><h3 style="margin-top:0;font-weight:normal;">Downloads</h3><hr><p>📁 Projetos</p><p>📄 imagem.png</p></div></div></div>
        </div>

        <!-- Terminal -->
        <div id="w-t" class="w">
            <div class="h"><span>Terminal</span>
                <div class="c">
                    <button class="btn" onclick="cls('w-t')"><svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg></button>
                    <button class="btn" onclick="fsk('w-t')"><svg viewBox="0 0 24 24"><path d="M18 4H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H6V6h12v12z"/></svg></button>
                    <button class="btn" onclick="cls('w-t')"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
                </div>
            </div>
            <div class="content"><div class="t-body" id="t-b" onclick="document.getElementById('t-i').focus()"><div>Welcome to Crosh. Type 'help' for commands.</div><div id="t-o"></div><span>chronos@cros:~ $ </span><input type="text" id="t-i" class="t-in" onkeydown="term(event)"></div></div>
        </div>

        <!-- PWA Builder -->
        <div id="w-s" class="w">
            <div class="h"><span>PWA Builder</span>
                <div class="c">
                    <button class="btn" onclick="cls('w-s')"><svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg></button>
                    <button class="btn" onclick="fsk('w-s')"><svg viewBox="0 0 24 24"><path d="M18 4H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H6V6h12v12z"/></svg></button>
                    <button class="btn" onclick="cls('w-s')"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
                </div>
            </div>
            <div class="content"><div style="padding:24px; max-width:400px;"><h2>Instalar PWA Manual</h2>
                <div class="form-group"><label>Nome do App:</label><input type="text" id="p-name" placeholder="Ex: YouTube"></div>
                <div class="form-group"><label>URL do site:</label><input type="text" id="p-url" placeholder="Ex: ://youtube.com"></div>
                <div class="form-group"><label>URL da Imagem/Ícone:</label><input type="text" id="p-icon" placeholder="Link da imagem png/svg"></div>
                <button class="add-btn" onclick="criarApp()">Instalar Aplicativo</button>
            </div></div>
        </div>
        <div id="pwas"></div>
    </div>

    <!-- Shelf -->
    <div id="shelf">
        <div class="s-icons" id="s-cont">

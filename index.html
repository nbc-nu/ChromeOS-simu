<!DOCTYPE html>
<html lang="pt-BR" style="margin:0;padding:0;overflow:hidden;height:100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChromeOS VM</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }
        
        #desktop {
            flex: 1;
            position: relative;
            width: 100%;
        }

        /* Estrutura das Janelas */
        .window-container {
            position: absolute;
            top: 30px;
            left: 30px;
            right: 30px;
            bottom: 80px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.4);
            display: none;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #bdc3c7;
        }

        /* Barra Superior Corrigida */
        .window-header {
            background: #dee1e6;
            padding: 0 8px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #cacdd1;
        }

        .window-title {
            font-size: 13px;
            color: #3c4043;
            font-weight: 500;
            margin-left: 10px;
        }

        /* Botões de controle no padrão correto (Minimizar, Maximizar, Fechar) */
        .window-controls {
            display: flex;
            height: 100%;
        }

        .control-btn {
            background: none;
            border: none;
            width: 44px;
            height: 100%;
            font-family: "Segoe UI Symbol", sans-serif;
            font-size: 11px;
            color: #5f6368;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.1s;
        }
        
        .control-btn:hover {
            background-color: rgba(0, 0, 0, 0.08);
            color: #202124;
        }
        
        .close-btn:hover {
            background-color: #e81123;
            color: #fff;
        }

        .window-content {
            width: 100%;
            height: calc(100% - 40px);
            background: #fff;
            overflow: auto;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Estilização Interna do Explorador de Arquivos */
        .file-browser {
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #202124;
        }
        .file-browser h1 {
            font-size: 22px;
            font-weight: normal;
            margin: 0 0 16px 0;
            border-bottom: 1px solid #e8eaed;
            padding-bottom: 12px;
        }
        .file-table {
            width: 100%;
            border-collapse: collapse;
        }
        .file-table th {
            text-align: left;
            font-weight: bold;
            font-size: 13px;
            padding: 8px;
            border-bottom: 1px solid #cbd5e1;
        }
        .file-table td {
            padding: 10px 8px;
            font-size: 13px;
        }
        .file-table tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        .file-table a {
            color: #1a73e8;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .file-table a:hover {
            text-decoration: underline;
        }

        /* Barra de Tarefas Inferior */
        #shelf {
            height: 56px;
            background: rgba(32, 33, 36, 0.95);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            z-index: 9999;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .shelf-icons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .app-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s;
            border-radius: 8px;
        }

        .app-icon:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.1);
        }

        .app-icon img {
            width: 34px;
            height: 34px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="desktop">
        
        <!-- Janela do Google Chrome -->
        <div id="win-chrome" class="window-container">
            <div class="window-header">
                <span class="window-title">Google Search</span>
                <div class="window-controls">
                    <button class="control-btn" onclick="fecharJanela('win-chrome')">🗕</button>
                    <button class="control-btn" onclick="abrirJanela('win-chrome')">🗖</button>
                    <button class="control-btn close-btn" onclick="fecharJanela('win-chrome')">✕</button>
                </div>
            </div>
            <div class="window-content">
                <iframe src="https://google.com"></iframe>
            </div>
        </div>

        <!-- Janela do Explorador de Arquivos (Nativo para não carregar em branco) -->
        <div id="win-arquivos" class="window-container">
            <div class="window-header">
                <span class="window-title">Índice de C:/</span>
                <div class="window-controls">
                    <button class="control-btn" onclick="fecharJanela('win-arquivos')">🗕</button>
                    <button class="control-btn" onclick="abrirJanela('win-arquivos')">🗖</button>
                    <button class="control-btn close-btn" onclick="fecharJanela('win-arquivos')">✕</button>
                </div>
            </div>
            <div class="window-content">
                <div class="file-browser">
                    <h1>Índice de C:/</h1>
                    <table class="file-table">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Tamanho</th>
                                <th>Última Modificação</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><a href="#">📁 .. (Diretório pai)</a></td>
                                <td>-</td>
                                <td>-</td>
                            </tr>
                            <tr>
                                <td><a href="#">📁 Arquivos de Programas</a></td>
                                <td>-</td>
                                <td>12/05/2026 14:22</td>
                            </tr>
                            <tr>
                                <td><a href="#">📁 Arquivos de Programas (x86)</a></td>
                                <td>-</td>
                                <td>12/05/2026 14:25</td>
                            </tr>
                            <tr>
                                <td><a href="#">📁 Usuários (Users)</a></td>
                                <td>-</td>
                                <td>10/10/2026 11:30</td>
                            </tr>
                            <tr>
                                <td><a href="#">📁 Windows</a></td>
                                <td>-</td>
                                <td>09/10/2026 18:45</td>
                            </tr>
                            <tr>
                                <td><a href="#">📄 log.txt</a></td>
                                <td>1.2 KB</td>
                                <td>10/10/2026 09:12</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Barra de Tarefas Inferior Corrigida -->
    <div id="shelf">
        <div class="shelf-icons">
            <!-- Launcher Menu -->
            <div class="app-icon" style="background: rgba(255,255,255,0.1);">
                <img src="https://wikimedia.org" alt="Launcher">
            </div>
            
            <!-- Ícone Original do Google Chrome -->
            <div class="app-icon" onclick="abrirJanela('win-chrome')">
                <img src="https://wikimedia.org" alt="Chrome">
            </div>
            
            <!-- Ícone do Explorador de Arquivos do ChromeOS -->
            <div class="app-icon" onclick="abrirJanela('win-arquivos')">
                <img src="https://wikimedia.org" alt="Arquivos">
            </div>
        </div>
    </div>

    <script>
        function abrirJanela(id) {
            document.querySelectorAll('.window-container').forEach(win => win.style.display = 'none');
            const janela = document.getElementById(id);
            janela.style.display = 'flex';
        }

        function fecharJanela(id) {
            document.getElementById(id).style.display = 'none';
        }
    </script>
</body>
</html>

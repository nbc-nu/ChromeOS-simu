<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#d9f1ff">
    <title>MiniVM</title>
    <!-- Link idêntico ao que você enviou -->
    <link id="favicon" rel="icon" type="image/svg+xml" href="https://www.google.com/chrome/static/images/chrome-logo.svg">
</head>
<body>

<!-- Primeira Tela: MiniVM (Azulada) -->
<div id="splash1" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#d9f1ff;display:flex;justify-content:center;align-items:center;z-index:9999;transition:opacity 1s ease;opacity:1;"> 
    <div style="font-family:sans-serif;font-size:24px;color:#fff;text-align:center;">
        MiniVM<br>
        <span style="font-size:16px; font-family:monospace; color:#000000;">by N.U.</span>
    </div> 
</div> 

<!-- Segunda Tela: ChromeOS (Preta) -->
<div id="splash2" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000000;display:none;justify-content:center;align-items:center;z-index:9998;transition:opacity 1s ease;opacity:0;"> 
    <div style="font-family:sans-serif;font-size:24px;color:#fff;">ChromeOS</div> 
</div> 

<script>
    const esperar = ms => new Promise(resolve => setTimeout(resolve, ms));

    async function rodarAnimacao() {
        var s1 = document.getElementById('splash1');
        var s2 = document.getElementById('splash2');

        // Truque para forçar o navegador a processar o favicon antes da animação
        var fav = document.getElementById('favicon');
        fav.href = fav.href + "?v=" + new Date().getTime();

        // 1. Mostra o MiniVM (Azul) por 2 segundos
        await esperar(2000);
        
        // 2. Faz o MiniVM sumir suavemente
        s1.style.opacity = '0';
        await esperar(1000);
        s1.style.display = 'none';

        // 3. Prepara e mostra o ChromeOS (Preto)
        s2.style.display = 'flex';
        await esperar(50); 
        s2.style.opacity = '1';
        
        // 4. Deixa o ChromeOS na tela por 2 segundos
        await esperar(2000);

        // 5. Faz o ChromeOS sumir suavemente
        s2.style.opacity = '0';
        await esperar(1000);
        s2.style.display = 'none';

        // 6. Redireciona para o sistema
        window.location.href = "run.html";
    }

    window.onload = rodarAnimacao;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" style="margin:0;padding:0;overflow:hidden;height:100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChromeOS VM</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none;
        }
        #desktop { flex: 1; position: relative; width: 100%; }
        .window-container {
            position: absolute; top: 40px; left: 40px; right: 40px; bottom: 80px;
            background: #fff; border-radius: 8px; box-shadow: 0 12px 35px rgba(0,0,0,0.35);
            display: none; flex-direction: column; overflow: hidden; border: 1px solid #cfd8dc;
        }
        .window-header {
            background: #f1f3f4; padding: 0 16px; height: 44px;
            display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e0e0e0;
        }
        .window-title { font-size: 13px; color: #202124; font-weight: 500; }
        .window-controls { display: flex; gap: 8px; align-items: center; }
        .control-btn {
            background: none; border: none; width: 32px; height: 32px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background-color 0.15s;
        }
        .control-btn:hover { background-color: rgba(0, 0, 0, 0.06); }
        .control-btn svg { width: 14px; height: 14px; fill: #5f6368; }
        .window-content { width: 100%; height: calc(100% - 44px); background: #fff; overflow: auto; }
        iframe { width: 100%; height: 100%; border: none; }
        .file-browser { padding: 24px; font-family: sans-serif; color: #202124; }
        .file-browser h1 { font-size: 22px; font-weight: normal; margin: 0 0 16px 0; border-bottom: 1px solid #e8eaed; padding-bottom: 12px; }
        .file-table { width: 100%; border-collapse: collapse; }
        .file-table th { text-align: left; font-weight: bold; font-size: 13px; padding: 8px; border-bottom: 1px solid #cbd5e1; }
        .file-table td { padding: 10px 8px; font-size: 13px; }
        .file-table tr:nth-child(even) { background-color: #f8f9fa; }
        .file-table a { color: #1a73e8; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .file-table a:hover { text-decoration: underline; }
        #shelf {
            height: 56px; background: rgba(32, 33, 36, 0.98);
            display: flex; align-items: center; justify-content: center;
            position: relative; width: 100%; z-index: 9999; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .shelf-icons { display: flex; gap: 16px; align-items: center; }
        .app-icon { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.15s; border-radius: 50%; }
        .app-icon:hover { transform: scale(1.1); background: rgba(255, 255, 255, 0.1); }
        .app-icon svg, .app-icon img { width: 32px; height: 32px; object-fit: contain; }
    </style>
</head>
<body>

    <div id="desktop">
        <!-- Janela do Google Chrome -->
        <div id="win-chrome" class="window-container">
            <div class="window-header">
                <span class="window-title">Google</span>
                <div class="window-controls">
                    <button class="control-btn" onclick="fecharJanela('win-chrome')">
                        <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
                    </button>
                    <button class="control-btn" onclick="abrirJanela('win-chrome')">
                        <svg viewBox="0 0 24 24"><path d="M18 4H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H6V6h12v12z"/></svg>
                    </button>
                    <button class="control-btn" onclick="fecharJanela('win-chrome')">
                        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                </div>
            </div>
            <div class="window-content">
                <iframe src="https://google.com/webph?igu=1"></iframe>
            </div>
        </div>

        <!-- Janela do Explorador de Arquivos -->
        <div id="win-arquivos" class="window-container">
            <div class="window-header">
                <span class="window-title">Índice de C:/</span>
                <div class="window-controls">
                    <button class="control-btn" onclick="fecharJanela('win-arquivos')">
                        <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
                    </button>
                    <button class="control-btn" onclick="abrirJanela('win-arquivos')">
                        <svg viewBox="0 0 24 24"><path d="M18 4H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H6V6h12v12z"/></svg>
                    </button>
                    <button class="control-btn" onclick="fecharJanela('win-arquivos')">
                        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                </div>
            </div>
            <div class="window-content">
                <div class="file-browser">
                    <h1>Índice de C:/</h1>
                    <table class="file-table">
                        <thead>
                            <tr><th>Nome</th><th>Tamanho</th><th>Última Modificação</th></tr>
                        </thead>
                        <tbody>
                            <tr><td><a href="#">📁 .. (Diretório pai)</a></td><td>-</td><td>-</td></tr>
                            <tr><td><a href="#">📁 Arquivos de Programas</a></td><td>-</td><td>12/05/2026 14:22</td></tr>
                            <tr><td><a href="#">📁 Arquivos de Programas (x86)</a></td><td>-</td><td>12/05/2026 14:25</td></tr>
                            <tr><td><a href="#">📁 Usuários (Users)</a></td><td>-</td><td>10/10/2026 11:30</td></tr>
                            <tr><td><a href="#">📁 Windows</a></td><td>-</td><td>09/10/2026 18:45</td></tr>
                            <tr><td><a href="#">📄 log.txt</a></td><td>1.2 KB</td><td>10/10/2026 09:12</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Barra de Tarefas Inferior -->
    <div id="shelf">
        <div class="shelf-icons">
            <!-- Launcher Circular Menu -->
            <div class="app-icon" style="background: rgba(255,255,255,0.15);">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="#ffffff"/></svg>
            </div>
            
            <!-- Link da Imagem Oficial do Chrome Atualizada -->
            <div class="app-icon" onclick="abrirJanela('win-chrome')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/Google_Chrome_icon_%28February_2022%29.svg" alt="Chrome">
            </div>
            
            <!-- Explorador de Arquivos -->
            <div class="app-icon" onclick="abrirJanela('win-arquivos')">
                <svg viewBox="0 0 24 24">
                    <path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z" fill="#42a5f5"/>
                    <path d="M20 8H4v10h16V8z" fill="#90caf9"/>
                </svg>
            </div>
        </div>
    </div>

    <script>
        function abrirJanela(id) {
            document.querySelectorAll('.window-container').forEach(win => win.style.display = 'none');
            const janela = document.getElementById(id);
            janela.style.display = 'flex';
        }
        function fecharJanela(id) {
            document.getElementById(id).style.display = 'none';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" style="margin:0;padding:0;overflow:hidden;height:100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChromeOS Desktop</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }
        
        #desktop {
            flex: 1;
            position: relative;
            width: 100%;
        }

        .window-container {
            position: absolute;
            top: 40px;
            left: 40px;
            right: 40px;
            bottom: 80px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #ccc;
        }

        .window-header {
            background: #f1f3f4;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #dadce0;
        }

        .window-title {
            font-size: 14px;
            color: #3c4043;
            font-weight: 500;
        }

        .window-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .control-btn {
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            color: #5f6368;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .control-btn:hover {
            background-color: rgba(0, 0, 0, 0.05);
            color: #202124;
        }
        .close-btn:hover {
            background-color: #e81123;
            color: white;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        #shelf {
            height: 56px;
            background: rgba(32, 33, 36, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            z-index: 9999;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .shelf-icons {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .app-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            border-radius: 8px;
        }

        .app-icon:hover {
            transform: scale(1.08);
            background: rgba(255, 255, 255, 0.15);
        }

        .app-icon svg {
            width: 32px;
            height: 32px;
        }
    </style>
</head>
<body>

    <div id="desktop">
        
        <!-- Janela do Google Chrome -->
        <div id="win-chrome" class="window-container">
            <div class="window-header">
                <span class="window-title">Google Search</span>
                <div class="window-controls">
                    <button class="control-btn" onclick="fecharJanela('win-chrome')">‒</button>
                    <button class="control-btn" onclick="abrirJanela('win-chrome')">🗖</button>
                    <button class="control-btn close-btn" onclick="fecharJanela('win-chrome')">✕</button>
                </div>
            </div>
            <iframe src="https://google.com"></iframe>
        </div>

        <!-- Janela do Explorador de Arquivos (C:\ Corrigido) -->
        <div id="win-arquivos" class="window-container">
            <div class="window-header">
                <span class="window-title">Índice de C:/</span>
                <div class="window-controls">
                    <button class="control-btn" onclick="fecharJanela('win-arquivos')">‒</button>
                    <button class="control-btn" onclick="abrirJanela('win-arquivos')">🗖</button>
                    <button class="control-btn close-btn" onclick="fecharJanela('win-arquivos')">✕</button>
                </div>
            </div>
            <!-- Correção dos caracteres inserindo <meta charset="UTF-8"> dentro do iframe -->
            <iframe src="data:text/html;charset=utf-8,%3C%21DOCTYPE%20html%3E%3Chtml%3E%3Chead%3E%3Cmeta%20charset%3D%22UTF-8%22%3E%3Ctitle%3E%C3%8Dndice%20de%20C%3A%2F%3E%3Cstyle%3Ebody%7Bfont-family%3Asans-serif%3Bpadding%3A20px%3Bcolor%3A%23202124%3B%7Dh1%7Bfont-size%3A1.6em%3Bborder-bottom%3A1px solid %23ccc%3Bpadding-bottom%3A10px%3Bfont-weight%3Anormal%3B%7Dtable%7Bwidth%3A100%25%3Bborder-collapse%3Acollapse%3B%7Dth%2Ctd%7Btext-align%3Aleft%3Bpadding%3A8px%3Bfont-size%3A14px%3B%7Dtr%3Anth-child%28even%29%7Bbackground%3A%23f8f9fa%3B%7Da%7Bcolor%3A%231a73e8%3Btext-decoration%3Anone%3B%7Da%3Ahover%7Btext-decoration%3Aunderline%3B%7D%3C%2Fstyle%3E%3C%2Fhead%3E%3Cbody%3E%3Ch1%3E%C3%8Dndice%20de%20C%3A%2F%3E%3Ctable%3E%3Cthead%3E%3Ctr%3E%3Cth%3ENome%3C%2Fth%3E%3Cth%3ETamanho%3C%2Fth%3E%3Cth%3E%C3%9Altima%20Modifica%C3%A7%C3%A3o%3C%2Fth%3E%3C%2Ftr%3E%3C%2thead%3E%3Ctbody%3E%3Ctr%3E%3Ctd%3E%3Ca%20href%3D%22%23%22%3E..%20%28Diret%C3%B3rio%20pai%29%3C%2Fa%3E%3C%2Ftd%3E%3Ctd%3E-%3C%2Ftd%3E%3Ctd%3E-%3C%2Ftd%3E%3C%2Ftr%3E%3Ctr%3E%3Ctd%3E%F0%9F%93%81%20%3Ca%20href%3D%22%23%22%3EArquivos%20de%20Programas%3C%2Fa%3E%3C%2Ftd%3E%3Ctd%3E-%3C%2Ftd%3E%3Ctd%3E12%2F05%2F2026%2014%3A22%3C%2Ftd%3E%3C%2Ftr%3E%3Ctr%3E%3Ctd%3E%F0%9F%93%81%20%3Ca%20href%3D%22%23%22%3EArquivos%20de%20Programas%20%28x86%29%3C%2Fa%3E%3C%2Ftd%3E%3Ctd%3E-%3C%2Ftd%3E%3Ctd%3E12%2F05%2F2026%2014%3A25%3C%2Ftd%3E%3C%2Ftr%3E%3Ctr%3E%3Ctd%3E%F0%9F%93%81%20%3Ca%20href%3D%22%23%22%3EUsu%C3%A1rios%20%28Users%29%3C%2Fa%3E%3C%2Ftd%3E%3Ctd%3E-%3C%2Ftd%3E%3Ctd%3E10%2F10%2F2026%2011%3A30%3C%2Ftd%3E%3C%2Ftr%3E%3Ctr%3E%3Ctd%3E%F0%9F%93%81%20%3Ca%20href%3D%22%23%22%3EWindows%3C%2Fa%3E%3C%2Ftd%3E%3Ctd%3E-%3C%2Ftd%3E%3Ctd%3E09%2F10%2F2026%2018%3A45%3C%2Ftd%3E%3C%2Ftr%3E%3Ctr%3E%3Ctd%3E%F0%9F%93%84%20%3Ca%20href%3D%22%23%22%3Elog.txt%3C%2Fa%3E%3C%2Ftd%3E%3Ctd%3E1.2%20KB%3C%2Ftd%3E%3Ctd%3E10%2F10%2F2026%2009%3A12%3C%2Ftd%3E%3C%2Ftr%3E%3C%2Ftbody%3E%3C%2Ftable%3E%3C%2Fbody%3E%3C%2Fhtml%3E">
            </iframe>
        </div>

    </div>

    <!-- Barra de tarefas com SVGs incorporados (evita quebra de imagem) -->
    <div id="shelf">
        <div class="shelf-icons">
            <!-- Launcher Menu -->
            <div class="app-icon" style="background: rgba(255,255,255,0.1);">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#fff"/></svg>
            </div>
            
            <!-- Ícone do Chrome (SVG Renderizado) -->
            <div class="app-icon" onclick="abrirJanela('win-chrome')">
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8 0-.34.03-.67.07-1h7.06c.4-.55.94-1 1.6-1.42l-3.53-6.11C10.2 3.17 11.08 3 12 3c4.41 0 8 3.59 8 8s-3.59 8-8 8z"/>
                    <path fill="#EA4335" d="M12 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
            </div>
            
            <!-- Ícone de Arquivos (SVG Renderizado) -->
            <div class="app-icon" onclick="abrirJanela('win-arquivos')">
                <svg viewBox="0 0 24 24" fill="#FFCA28">
                    <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
                </svg>
            </div>
        </div>
    </div>

    <script>
        function abrirJanela(id) {
            document.querySelectorAll('.window-container').forEach(win => win.style.display = 'none');
            const janela = document.getElementById(id);
            janela.style.display = 'flex';
        }

        function fecharJanela(id) {
            document.getElementById(id).style.display = 'none';
        }
    </script>
</body>
</html>
